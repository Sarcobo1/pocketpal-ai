name: Validate TS

# Fast loop for source changes: typecheck + lint without the Android toolchain.
# Runs on push to this branch so a broken edit fails in ~10 minutes instead of
# after a full APK build.

on:
  push:
    branches:
      - local-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Voice and chat unit tests
        run: yarn test --ci --runTestsByPath src/utils/__tests__/chat.test.ts src/services/plus/__tests__/gate.test.ts 2>&1 | tail -40

      # The media turn has five moving parts — pairing, resolution, the live
      # attach, the payload shape and the engine choice — and a phone test costs
      # a full APK build, so the suites that cover them gate the branch here.
      - name: Multimodal and voice-mode unit tests
        run: |
          set -eo pipefail
          yarn test --ci --runTestsByPath \
            src/store/__tests__/ModelStore.localMultimodal.test.ts \
            src/utils/__tests__/multimodalHelpers.test.ts \
            src/services/voice/__tests__/omniEngine.test.ts \
            src/hooks/__tests__/useChatSession.test.ts \
            src/hooks/__tests__/useChatSession.assistantTurn.test.ts \
            src/hooks/__tests__/useVoiceMode.test.ts
