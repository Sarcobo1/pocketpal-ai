name: Validate TS

# Fast loop for source changes: typecheck + lint without the Android toolchain.
# Runs on push to this branch so a broken edit fails in ~10 minutes instead of
# after a full APK build.

on:
  push:
    branches:
      - local-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # A chosen subset can never reach the 60% floor jest.config.js sets, so
      # coverage is switched off here and the gate is the suites themselves.
      # Piping jest into tail would also discard its exit status.
      - name: Voice, chat and projector unit tests
        run: |
          set -eo pipefail
          yarn test --ci --coverage=false --runTestsByPath \
            src/utils/__tests__/chat.test.ts \
            src/utils/__tests__/omniMode.test.ts \
            src/utils/__tests__/modelSkills.test.ts \
            src/utils/__tests__/multimodalHelpers.test.ts \
            src/services/plus/__tests__/gate.test.ts \
            src/services/voice/__tests__/abBench.test.ts \
            src/services/voice/__tests__/endpointer.test.ts \
            src/services/voice/__tests__/frameSource.test.ts \
            src/services/voice/__tests__/omniEngine.test.ts \
            src/services/voice/__tests__/omniSpeech.test.ts \
            src/services/voice/__tests__/speechStream.test.ts \
            src/services/voice/__tests__/streamSink.test.ts \
            src/services/voice/__tests__/speechLevel.test.ts \
            src/services/voice/__tests__/wav.test.ts \
            src/store/__tests__/ModelStore.localMultimodal.test.ts \
            src/store/__tests__/ModelStore.autoProjector.test.ts \
            src/store/__tests__/ModelStore.projectorMedia.test.ts \
            src/store/__tests__/TTSStore.test.ts \
            src/components/VoiceModeView/__tests__/VoiceModeView.test.tsx \
            src/components/VoiceSetupSheet/__tests__/VoiceSetupSheet.test.tsx \
            src/screens/ModelsScreen/HFModelSearch/DetailsView/ModelFileCard/__tests__/ModelFileCard.test.tsx \
            src/hooks/__tests__/useChatSession.test.ts \
            src/hooks/__tests__/useChatSession.assistantTurn.test.ts \
            src/hooks/__tests__/useVoiceMode.test.ts
